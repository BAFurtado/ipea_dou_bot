name: DOU Career Radar
run-name: ${{ github.actor }} — DOU Career Radar scan
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Career Radar
        run: python career_radar.py

      - name: Check for changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DOU Career Radar — $(date +%Y-%m-%d)"

      - name: Push
        if: steps.verify_diff.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Send email
        if: steps.verify_diff.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: DOU Career Radar — new results
          to: bb.cron.jobs@gmail.com
          from: DOU Career Radar
          body: Build job of ${{github.repository}} completed successfully!
          ignore_cert: true
          attachments: README.md
