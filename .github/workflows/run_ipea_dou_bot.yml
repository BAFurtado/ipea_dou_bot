name: DOU Career Radar
run-name: ${{ github.actor }} — DOU Career Radar scan
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Run Career Radar
        run: python career_radar.py

      - name: Check for changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DOU Career Radar — $(date +%Y-%m-%d)"

      - name: Push
        if: steps.verify_diff.outputs.changed == 'true'
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Is it Friday?
        id: dow
        run: |
          if [ "$(date -u +%u)" = "5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "weekly=true" >> $GITHUB_OUTPUT
          else
            echo "weekly=false" >> $GITHUB_OUTPUT
          fi

      # Weekly only. Two months of daily mail produced ~3 items/day of which
      # roughly one per three weeks was actionable, so it stopped being read.
      - name: Send weekly digest
        if: steps.dow.outputs.weekly == 'true' && hashFiles('WEEKLY.md') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: DOU Career Radar — resumo da semana
          to: furtadobb@gmail.com
          from: DOU Career Radar
          html_body: file://WEEKLY.md
          convert_markdown: true
          ignore_cert: true
          attachments: WEEKLY.md
